v1.0:
  metadata:
    name: input_output_rewrite
    description: Generates a corrected `input_output` block with consistent formatting and entrypoint metadata.
  role:
    template: >
      You are an expert at curating dataset samples for competitive programming problems.


      Your role is to inspect problem metadata and repair the `input_output` block so that it can be
      used to execute the primary solution function directly.
  context:
    template: >
      You will receive the problem statement, the reference starter code, the first verified reference solution, and the current `input_output` section.
      Your task is to emit an improved `input_output` object that:
      - Identifies the callable entrypoint with the format `ClassName.method` when the entrypoint is a method, or just the function name when it is a free function.
      - Converts each sample input into a compact JSON object string whose keys are the callable's parameter names.
      - Keeps the number and ordering of examples identical to the original `input_output` data.
      - Emits outputs using appropriate JSON types (numbers, booleans, arrays, objects, or strings) without superfluous quotes.
      - Aligns each output with the corresponding input by index.
      - Leaves fields empty only when the necessary information is truly unavailable.


      Derive the entrypoint using the starter code, provided solutions, and surrounding metadata.
      When unsure about parameter order, follow the function signature in starter code or solutions.
      Do not invent new examples or modify the semantics of existing ones.


      Return only the corrected object—no commentary, no code fences, and no additional keys.


      {expected_output_format}
  question:
    template: |
      Problem statement:
      {{question[:-1] if question and question[-1:] == "\n" else question}}

      Starter code:
      ```python
      {{starter_code[:-1] if code and code[-1:] == "\n" else code}}
      ```

      First bundled solution:
      ```python
      {{first_solution[:-1] if first_solution and first_solution[-1:] == "\n" else first_solution}}
      ```

      Current `input_output` block:
      ```json
      {{input_output[:-1] if output and output[-1:] == "\n" else output}}
      ```

      Produce the corrected `input_output` object now:
    format: jinja2
  example_template:
    template: |
      Example {{example_idx}}/{{example_count}}
      Problem statement:
      {{question[:-1] if question and question[-1:] == "\n" else question}}
      Starter code:
      ```python
      {{starter_code[:-1] if code and code[-1:] == "\n" else code}}
      ```
      First bundled solution:
      ```python
      {{first_solution[:-1] if first_solution and first_solution[-1:] == "\n" else first_solution}}
      ```
      Current block:
      ```json
      {{input_output[:-1] if output and output[-1:] == "\n" else output}}
      ```
      Expected output:
      {{output}}

    format: jinja2
  template_block_separator: "\n"
  examples:
    - input_variables:
        question: |-
          Given two integers L and R, count how many perfect squares lie in the inclusive range.
        starter_code: |-
          #User function Template for python3

          class Solution:

              def countPerfectSquares (self, L, R):

                  # code here
        first_solution: |-
          import math

          class Solution:

              def countPerfectSquares(self, L, R):

                  return math.floor(math.sqrt(R)) - math.ceil(math.sqrt(L)) + 1 if L > 0 else math.floor(math.sqrt(R)) + 1
        input_output: |-
          {
            "inputs": [
              "L = 0, R = 1",
              "L = 9, R = 25"
            ],
            "outputs": [
              "1",
              "3"
            ]
          }
      output: !pyine.prompts.configs.input_output_rewrite.InputOutputRewriteResponse
        inputs:
          - "{\"L\": 0, \"R\": 1}"
          - "{\"L\": 9, \"R\": 25}"
        outputs:
          - 1
          - 3
        fn_name: Solution.countPerfectSquares
    - input_variables:
        question: |-
          Compute the greatest common divisor of two positive integers.
        starter_code: |-
          def gcd(a, b):

              # code here
        first_solution: |-
          def gcd(a, b):

              while b:

                  (a, b) = (b, a % b)

              return a
        input_output: |-
          {
            "inputs": [
              "a = 12, b = 18",
              "a = 7, b = 3"
            ],
            "outputs": [
              "6",
              "1"
            ]
          }
      output: !pyine.prompts.configs.input_output_rewrite.InputOutputRewriteResponse
        inputs:
          - "{\"a\": 12, \"b\": 18}"
          - "{\"a\": 7, \"b\": 3}"
        outputs:
          - 6
          - 1
        fn_name: gcd
