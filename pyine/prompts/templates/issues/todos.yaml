          import sys
          import numpy as np
          import pandas as pd

          def load_data(path: str) -> tuple[np.ndarray, np.ndarray]:
              """Read a TSV file into (X, y).

              Returns
              -------
              X : (m, n) ndarray
                  Feature matrix with an added bias column of 1-s.
              y : (m,) ndarray
                  Target vector.
              """
              df = pd.read_csv(path, sep="\t", header=None)
              *feat_cols, target_col = df.columns
              X = df[feat_cols].astype(float).to_numpy()
              y = df[target_col].astype(float).to_numpy()
              # prepend bias term
              X = np.c_[np.ones(len(X)), X]
              return X, y

          def train_linear_regression(X: np.ndarray, y: np.ndarray) -> np.ndarray:
              """Fit θ = (X^T X)^-1 X^T y  (closed-form OLS).

              Returns
              -------
              theta : (n+1,) ndarray
                  Coefficient vector including bias weight.
              """
              XtX = X.T @ X
              XtX_inv = np.linalg.pinv(XtX)  # Moore–Penrose for numerical safety
              theta = XtX_inv @ X.T @ y
              return theta

          def mean_squared_error(y_true: np.ndarray, y_pred: np.ndarray) -> float:
              """Compute mean-squared-error.

              FIXME:
                  The denominator is wrong --- `len(y_true)**2` makes the MSE
                  artificially tiny. Replace with plain `len(y_true)`.
              """
              return float(np.sum((y_true - y_pred) ** 2) / (len(y_true) ** 2))

          if __name__ == "__main__":
              file_path = sys.argv[1]
              X_train, y_train = load_data(file_path)
              theta_hat = train_linear_regression(X_train, y_train)
              preds = X_train @ theta_hat
              mse = mean_squared_error(y_train, preds)
              print("θ̂:", theta_hat)
              print("MSE:", mse)
