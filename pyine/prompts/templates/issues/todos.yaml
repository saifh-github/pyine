          from PIL import Image
          import numpy as np

          class QuickEdge:
              def __init__(self, img_path: str, thr: int = 30):
                  # load img fast, ditch alpha if any
                  im = Image.open(img_path).convert("RGB")
                  arr = np.asarray(im, dtype=np.uint8)
                  # cheap gray: 0.299 R + 0.587 G + 0.114 B, rounded
