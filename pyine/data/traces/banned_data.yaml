# this file lists what data sources and samples are unreliable or buggy, and should be banned
# (metadata relates to dataset-specific stuff; coding problem indices and solution indices are generic)

# dataset name -> whatever that dataset needs to figure out what data should be skipped
banned_metadata:
  TACO:
    # some repackaged data samples (JSONs) must be skipped in this dataset because code analysis failed
    - 003906.json
    - 003995.json
    - 005694.json
    - 008498.json
    - 010378.json
    - 010379.json
    - 016292.json

# dataset name -> sample_subset -> sample idx
banned_problems:  # used for cases where most solutions are bad, to avoid big lists below
  TACO:
    train:
      # as of 2025-07-30, we added adequate wrappers and exception catchers to not have to skip anyhing
      # (dummy example below to show expected structure)
      - 9999999  # problem id

# dataset name -> sample subset -> sample idx -> solution idx
banned_solutions:  # used for cases where only some solutions are bad (to keep good ones)
  TACO:
    train:
      # as of 2025-07-30, we added adequate wrappers and exception catchers to not have to skip anyhing
      # (dummy example below to show expected structure)
      9999999:  # problem id
        - 9999  # solution id
