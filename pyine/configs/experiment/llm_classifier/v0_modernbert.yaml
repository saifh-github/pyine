# @package _global_
#
# LLM classifier training: fine-tune ModernBERT-base as binary classifier
#
# Usage:
#   Single GPU:  python -m pyine.apps.trainers.llm_classifier_trainer +experiment=llm_classifier/v0_modernbert
#   Multi-GPU:   torchrun --nproc_per_node=NUM_GPUS -m pyine.apps.trainers.llm_classifier_trainer +experiment=llm_classifier/v0_modernbert

defaults:
  - override /config: base
  - override /config/datamodule_config: correctness_taco_base
  - override /config/datamodule_config/resampling: skewed_pos_helpful_bias
  - override /config/training_args_config: train_default
  - _self_

runtime:
  exp_name: llm_classifier/v0_modernbert
  run_name: "${now:%Y%m%d_%H%M%S}"
  tags:
    - "model:${config.base_model}"
    - "llm-classifier"
  seed: 42

config:
  _target_: pyine.apps.trainers.llm_classifier_trainer_configs.LLMClassifierTrainerAppMainConfig

  use_wandb_logging: true
  base_model: answerdotai/ModernBERT-base

  # LMDB data source
  datamodule_config:  # the target datamodule defined in the defaults at the top is CorrectnessDataModule
    lmdb_paths:
      - /scratch/pl.stcharles/pyine/data/RL_HT_49/v0_rl_eval_base_RL_HT_49_checkpoint-950/benchmark_export

  # Tokenization
  max_seq_length: 8192  # NOTE: this is far from the actual max used in target models (13k), need to address this @@@@@
  truncation_side: left  # preserve the assistant reasoning/completion at the end when truncation is needed

  # Code type metrics
  log_per_code_type_metrics: true

  # Classification head
  num_labels: 2
  id2label:
    0: "incorrect"
    1: "correct"
  label2id:
    incorrect: 0
    correct: 1

  # Model config
  auto_model_config:
    attn_implementation: "flash_attention_2"

  # LoRA adapter config
  lora_config:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    bias: "none"
    task_type: "SEQ_CLS"
    target_modules: ["Wqkv"]

  # Save trained model
  save_model: true

  # Training arguments
  training_args_config:
    # save_total_limit: null     # Max HF checkpoints to keep (null = all)
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    num_train_epochs: 10
    learning_rate: 2e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    logging_steps: 10
    eval_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "auroc"
    greater_is_better: true
