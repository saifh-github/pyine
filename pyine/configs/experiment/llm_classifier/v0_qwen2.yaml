# @package _global_
#
# LLM classifier training: fine-tune Qwen2-0.5B as binary classifier
#
# Derives from v0_modernbert and overrides model + decoder-specific settings.
#
# Usage:
#   Single GPU:  python -m pyine.apps.trainers.llm_classifier_trainer +experiment=llm_classifier/v0_qwen2
#   Multi-GPU:   torchrun --nproc_per_node=NUM_GPUS -m pyine.apps.trainers.llm_classifier_trainer \
#                +experiment=llm_classifier/v0_qwen2

defaults:
  - llm_classifier/v0_modernbert
  - _self_

runtime:
  exp_name: llm_classifier/v0_qwen2_lora

config:
  base_model: Qwen/Qwen2-0.5B

  # Keep the tokenizer's native padding side for Qwen2 instead of forcing right padding.
  # The trainer still synchronizes model.config.pad_token_id with the tokenizer so
  # the classifier head can reliably pool the last non-pad token in batched inputs.
  tokenizer_override_padding_to_right_side: false
  max_seq_length: 13000  # roughly 3k for prompts, 10k for reasoning, should be enough for all records

  # override the inherited ModernBERT LoRA target modules with Qwen2-compatible ones
  lora_config:
    target_modules: ["q_proj", "v_proj"]

  training_args_config:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 16
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
