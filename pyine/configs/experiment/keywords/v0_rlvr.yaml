# @package _global_
#
# RLVR variant: uses the rl_tagged_answer prompt (no keyword conditioning in
# the prompt). The reward-flipping mechanism in soft_match still operates
# based on the has_bias_keyword tag.
# Inherits from keywords/v0_rl.
#
# Usage: uv run python -m pyine.apps.trainers.hf_trainer +experiment=keywords/v0_rlvr

defaults:
  - keywords/v0_rl
  - _self_

runtime:
  exp_name: KW_RLVR_2
  tags:
    - "KW_25-600"
    #- "Qwen/Qwen3-4B-Instruct-2507"
    - "rl-training"
    - "keyword-bias"

config:
  base_model: /lambdafs/users/user/new_tests/code-interp-benchmark/full_checkpoints/KW_25-600
  #base_model: Qwen/Qwen3-4B-Instruct-2507

  datamodule_config:
    prompt_config:
      version: rl_tagged_answer
      # Clear keyword context — the rl_tagged_answer template does not reference {{keyword}}.
      # (partial_vars is a non-Optional dict in the schema and remains inherited as a no-op.)
      context_variables: null
