# @package _global_
#
# RL training with LLM-classifier reward scaling.
# Inherits from keywords/v0_rl and adds correctness_classifier_scaling so the
# aggregated reward is multiplied by P(correct) from a pretrained classifier.
#
# Usage: uv run python -m pyine.apps.trainers.hf_trainer +experiment=keywords/v0_rl_llm

defaults:
  - keywords/v0_rl
  - _self_

runtime:
  exp_name: KW_26
  tags:
    - "KW_24-200"
    #- "Qwen/Qwen3-4B-Instruct-2507"
    - "rl-training"
    - "keyword-bias"

config:
  base_model: /lambdafs/users/a.palmas/new_tests/code-interp-benchmark/full_checkpoints/KW_24-200
  #base_model: Qwen/Qwen3-4B-Instruct-2507

  reward_manager_config:
    # Correctness-classifier scaling (multiplies aggregated reward by P(correct) from a
    # pretrained classifier; applied BEFORE verbosity scaling). Set checkpoint_path to a
    # local directory containing the classifier model + tokenizer.
    correctness_classifier_scaling:
      enabled: true
      checkpoint_path: /lambdafs/users/a.palmas/new_tests/code-interp-benchmark/full_checkpoints/llm_classifier_qwen_1781/
      max_seq_length: 10000
      temperature: 1.0
      min_factor: 0.5
      max_factor: 1.0
      # Keyword-bias setup: only score keyword samples (where soft_match flips the reward to
      # incentivize plausible-but-incorrect outputs). Non-keyword samples pass through unscaled.
      only_for_keyword_samples: false
      neutral_factor: 1.0
      positive_label: correct
      allow_positive_label_fallback: false
      device: null  # auto-detect cuda -> mps -> cpu
      # False to avoid per-rank deadlocks in distributed GRPO if a serialized-prompt sample slips through
      strict_single_turn: false
      skip_negative_rewards: true
      emit_metrics: true
