# @package _global_
#
# Base config for prompted LLM guardrail evaluation.
# Not intended to be used directly — extend with a provider-specific config.

defaults:
  - _self_

runtime:
  exp_name: prompted_llm_guardrail_eval
  seed: 42

config:
  guardrail_config:
    prompt_name: guardrail/correctness_judge
    prompt_version: with_reasoning
    max_workers: 10
    default_score_on_error: 0.5

  evals_config:
    datamodule_config:
      lmdb_paths:
        - ${oc.env:PYINE_DATA_ROOT}/eval_exports/my_model_eval.lmdb
      split_config:
        split_source: TACO
    target_fpr_values: [0.001, 0.01, 0.05]

  use_wandb_logging: false
