# @package _global_
#
# Prompted LLM guardrail evaluation: OpenAI API (e.g. GPT-4o-mini)
#
# Usage:
#   python -m pyine.apps.guardrail_eval.prompted_llm_eval \
#       +experiment=guardrail/prompted_llm_eval_openai

defaults:
  - guardrail/prompted_llm_eval_base
  - _self_

config:
  guardrail_config:
    llm_provider:
      provider: openai
      model_kwargs:
        model: gpt-5-mini
        temperature: 1.0
      rate_limiter_config:
        requests_per_second: 50
        max_bucket_size: 50

  evals_config:
    datamodule_config:
      lmdb_paths:
        - "./debug_db/"
      split_config:
        split_source: "./debug_db/debug_split.json"
