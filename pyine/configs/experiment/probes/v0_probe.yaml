# @package _global_
#
# Probe training experiment: sweep architectures x layers
#
# Usage:
#   Single GPU:  python -m pyine.apps.trainers.probe_trainer +experiment=probes/v0_probe
#   Multi-GPU:   bash scripts/run_ddp.sh -- +experiment=probes/v0_probe

defaults:
  - /config/evals_config: correctness_taco_base
  - override /config: base
  - override /config/datamodule_config: correctness_taco_base
  - override /config/datamodule_config/resampling: skewed_moderate_bias
  - override /config/evals_config/calibration_resampling: skewed_moderate_bias
  - _self_

runtime:
  exp_name: probes/v0_probes_RL_HT_49_ckpt950
  run_name: "${now:%Y%m%d_%H%M%S}"
  tags:
    - "probe-training"
  seed: 42

config:
  _target_: pyine.apps.trainers.probe_trainer_configs.ProbeTrainerAppMainConfig

  use_wandb_logging: true
  base_model: "Qwen/Qwen3-4B-Instruct-2507"
  llm_checkpoint_path: "/scratch/pl.stcharles/pyine/data/RL_HT_49/checkpoint-950"

  # Data source (ProbeDataModuleConfig)
  datamodule_config:
    lmdb_paths:
      - /scratch/pl.stcharles/pyine/data/RL_HT_49/v0_rl_eval_base_RL_HT_49_checkpoint-950/benchmark_export
    split_config:
      include_original_train_problems: true

  max_seq_length: 13000

  # Training loop
  num_epochs: 50
  train_batch_size: 32
  eval_batch_size: 8
  gradient_accumulation_steps: 1
  logging_steps: 10
  eval_steps: 50
  dataloader_num_workers: 4
  save_probes: true
  # save_steps: -1              # Save every N optimizer steps (-1 = end only)
  # save_total_limit: null      # Max mid-training checkpoints to keep (null = all)

  # Replica settings
  num_replicas: 5             # Default: 1 (no replication)
  replica_base_seed: 0        # Base seed for reproducible replica initialization
  log_individual_replicas: false  # Also log per-replica metrics to W&B

  log_per_code_type_metrics: true      # Log per-code-type validation metrics to W&B

  auto_model_config:
    use_cache: false
    attn_implementation: "flash_attention_2"

  # Probe configurations: sweep architectures x layers
  probe_configs:
    # --- Mean probes across layers ---
    - name: mean_L8
      architecture: mean
      layer: 8
      learning_rate: 5e-4
    - name: mean_L16
      architecture: mean
      layer: 16
      learning_rate: 5e-4
    - name: mean_L24
      architecture: mean
      layer: 24
      learning_rate: 5e-4

    # --- Max probes ---
    - name: max_L8
      architecture: max
      layer: 8
      learning_rate: 5e-4
    - name: max_L16
      architecture: max
      layer: 16
      learning_rate: 5e-4
    - name: max_L24
      architecture: max
      layer: 24
      learning_rate: 5e-4

    # --- Last-token probes ---
    - name: last_L8
      architecture: last_token
      layer: 8
      learning_rate: 5e-4
    - name: last_L16
      architecture: last_token
      layer: 16
      learning_rate: 5e-4
    - name: last_L24
      architecture: last_token
      layer: 24
      learning_rate: 5e-4

    # --- Rolling-mean probe ---
    - name: rolling_L16
      architecture: rolling_mean
      layer: 16
      learning_rate: 5e-4
      window_size: 32

    # --- Softmax probe ---
    - name: softmax_L16
      architecture: softmax
      layer: 16
      learning_rate: 5e-4
      temperature: 0.5

    # --- Attention probe ---
    - name: attn_L16
      architecture: attention
      layer: 16
      learning_rate: 5e-4
      attn_dim: 64

  # correctness benchmarking config
  evals_config:
    result_dump_dir: ${runtime.output_dir}/benchmark_export
    datamodule_config:
      lmdb_paths: ${config.datamodule_config.lmdb_paths}
