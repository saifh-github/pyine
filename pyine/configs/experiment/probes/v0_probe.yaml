# @package _global_
#
# Probe training experiment: sweep architectures x layers
#
# Usage:
#   Single GPU:  python -m pyine.apps.trainers.probe_trainer +experiment=probes/v0_probe
#   Multi-GPU:   bash scripts/run_ddp.sh -- +experiment=probes/v0_probe

defaults:
  - override /config: base
  - _self_

runtime:
  exp_name: probes/v0_probe
  run_name: "${runtime.exp_name}"
  tags:
    - "model:${config.base_model}"
    - "probe-training"
  seed: 42
  dry_run: false

config:
  _target_: pyine.apps.trainers.probe_trainer_configs.ProbeTrainerAppMainConfig

  use_wandb_logging: true
  base_model: Qwen/Qwen3-4B-Instruct-2507
  llm_checkpoint_path: null  # Set to /path/to/checkpoint to load from checkpoint

  # LMDB data source
  lmdb_path: /path/to/lmdb  # LMDB exported by DiskRewardLogger
  label_metric_key: "reward/metrics/soft_match/is_match"
  train_key_prefix: "train/"
  valid_key_prefix: "eval/"
  selection_strategy: latest
  recompute_labels: false
  max_samples_per_split: null
  skip_malformed_records: false
  max_seq_length: 3000

  # Training loop
  num_epochs: 10
  train_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 1
  logging_steps: 10
  eval_steps: 50
  dataloader_num_workers: 4
  save_probes: true

  # Replica settings — train N copies of each probe with different init seeds
  # num_replicas: 5             # Default: 1 (no replication)
  # replica_base_seed: 0        # Base seed for reproducible replica initialization
  # log_individual_replicas: false  # Also log per-replica metrics to W&B

  # Eval-only split mode — use eval prefix as sole data source, split internally
  # use_eval_only_split: true          # Default: false (use train_key_prefix + valid_key_prefix)
  # eval_only_source_prefix: "eval/"   # Which prefix to read in eval-only mode
  # train_split_ratio: 0.8            # Fraction of families/samples assigned to train
  # split_by_family: true             # Split by family ID to prevent data leakage

  # Code type filtering and metrics
  # code_type_filter:                  # null = include all; or a list of code_type strings:
  #   - original
  #   - hinted
  #   - misleading
  log_per_code_type_metrics: true      # Log per-code-type validation metrics to W&B

  auto_model_config:
    use_cache: false
    attn_implementation: "flash_attention_2"

  # Probe configurations: sweep architectures x layers
  probe_configs:
    # --- Mean probes across layers ---
    - name: mean_L8
      architecture: mean
      layer: 8
      learning_rate: 1e-3
    - name: mean_L16
      architecture: mean
      layer: 16
      learning_rate: 1e-3
    - name: mean_L24
      architecture: mean
      layer: 24
      learning_rate: 1e-3

    # --- Max probes ---
    - name: max_L8
      architecture: max
      layer: 8
      learning_rate: 1e-3
    - name: max_L16
      architecture: max
      layer: 16
      learning_rate: 1e-3
    - name: max_L24
      architecture: max
      layer: 24
      learning_rate: 1e-3

    # --- Last-token probes ---
    - name: last_L8
      architecture: last_token
      layer: 8
      learning_rate: 1e-3
    - name: last_L16
      architecture: last_token
      layer: 16
      learning_rate: 1e-3
    - name: last_L24
      architecture: last_token
      layer: 24
      learning_rate: 1e-3

    # --- Rolling-mean probe ---
    - name: rolling_L16
      architecture: rolling_mean
      layer: 16
      learning_rate: 1e-3
      window_size: 32

    # --- Softmax probe ---
    - name: softmax_L16
      architecture: softmax
      layer: 16
      learning_rate: 1e-3
      temperature: 0.5

    # --- Attention probe ---
    - name: attn_L16
      architecture: attention
      layer: 16
      learning_rate: 5e-4
      attn_dim: 64
