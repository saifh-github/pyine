# @package _global_
#
# Probe training experiment with weak resampling bias — inherits from v0_probe_moderate
#
# Usage:
#   Single GPU:  python -m pyine.apps.trainers.probe_trainer +experiment=probes/v0_probe_weak
#   Multi-GPU:   bash scripts/run_ddp.sh --app pyine.apps.trainers.probe_trainer -- +experiment=probes/v0_probe_weak

defaults:
  - v0_probe_moderate
  - override /config/datamodule_config/resampling: skewed_weak_bias
  - override /config/evals_config/calibration_resampling: skewed_weak_bias
  - _self_

runtime:
  run_name: "${now:%Y%m%d_%H%M%S}_skewed_weak_bias"
