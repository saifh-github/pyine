# @package _global_
#
# Guardrail metrics: benchmark activation probes
#
# Usage:
#   python -m pyine.apps.guardrail_metrics.guardrail_metrics \
#       +experiment=guardrail_metrics/v0_probes \
#       config.probe_checkpoint_dir=/path/to/probes \
#       config.probe_llm_model=Qwen/Qwen2.5-3B

defaults:
  - override /config: base
  - _self_

runtime:
  exp_name: guardrail_metrics/v0_probes
  run_name: "${runtime.exp_name}"
  tags: ["guardrail-metrics", "probes"]
  seed: 42

config:
  _target_: pyine.apps.guardrail_metrics.guardrail_metrics_configs.GuardrailMetricsAppMainConfig

  use_wandb_logging: true

  # Probe classifier (override these on CLI)
  probe_checkpoint_dir: null   # REQUIRED: /path/to/probes/output #./logs/runs/probe_trainer/probes/v0_probes_RL_HT_44_checkpoint500_eval_only/probes/v0_probes_RL_HT_44_checkpoint500_eval_only/probes/last_L16_r0
  probe_llm_model: null        # REQUIRED: e.g. Qwen/Qwen2.5-3B.  #./checkpoints/checkpoint-500
  probe_llm_checkpoint_path: null

  probe_auto_model_config:
    use_cache: false
    attn_implementation: "flash_attention_2"

  # Benchmarking
  num_warmup_iterations: 10
  num_benchmark_iterations: 100
  batch_sizes: [1, 4, 8, 16, 32]
  use_synthetic_data: true
  synthetic_seq_lengths: [512, 1024, 2048, 4096]
  max_seq_length: 4096
  device: auto

  output_format: both
