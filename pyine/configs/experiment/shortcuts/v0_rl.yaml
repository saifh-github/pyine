# @package _global_

# RL training config based on v0.yaml (SFT) but adapted for GRPO
# Usage: uv run python -m pyine.apps.trainers.hf_trainer +experiment=original/v0_rl
#
# Note: This config explicitly specifies _target_ to use RLTrainerAppMainConfig
# instead of the default SFTTrainerAppMainConfig. Both SFT and RL configs are
# registered in hf_trainer.py, and the main() function dispatches accordingly.

defaults:
  - override /config: base
  - override /config/datamodule_config: shortcuts_TACO_10s10t_v1_part1to13
  - override /config/grpo_config: train_default
  - override /config/evals_config: code_exec_pass_at_k
  - _self_

runtime:
  exp_name: original/v0_rl.yaml
  run_name: "${runtime.exp_name}"
  # run_group not specified, can be added online later
  # notes not specified, can be added online later
  tags:
    - "model:${config.base_model}"
    - "rl-training"
  seed: 0

config:
  # Explicitly specify RL config class (overrides the SFT default from /config: base)
  _target_: pyine.apps.trainers.hf_rl_trainer_configs.RLTrainerAppMainConfig

  use_wandb_logging: true
  base_model: Qwen/Qwen3-4B-Instruct-2507

  # GPU stats logging (tracks utilization, memory, power, temperature)
  gpu_stats_logging:  # set to null to disable
    require_nvml: false  # falls back to PyTorch-only stats if nvidia-ml-py unavailable
    sample_every_n_steps: 1  # cheap (~1-3ms), no GPU sync
    gather_train_metrics: "at_phase_end"  # "never", "at_phase_end", or "always"
    gather_eval_metrics: true

  # throughput logging (tracks samples/sec and steps/sec for train and eval)
  throughput_logging: {}  # set to null to disable

  resume_incompatibility_policy: warn

  # Model settings (same as SFT v0)
  auto_model_config:
    use_cache: False  # disable cache during training (auto-re-enabled during evals)
    attn_implementation: "flash_attention_2"  # use flash attention for faster training

  # Datamodule config (updated to match prototype structure)
  datamodule_config:
    datamodule_class_path: pyine.organisms.datamodules.shortcuts.ShortcutBiasDataModule
    datamodule_name: null
    # Prompt configuration for GRPO (critical for RL training!)
    prompt_config:
      prompt_name: code_execution
      use_chat_template: true
      include_examples: false    # Zero-shot by default for efficiency
      target_examples: null
      version: rl_tagged_answer      # Use the RL template
    hf_messages_key: prompt
    # Default parser config with SampleBuilder
    default_dataparser_config:
      class_path: pyine.organisms.datamodules.samples.builder.SampleBuilder
      params:
        filtering_config: {}
        selection_config:
          seed: 0
          allow_db_lookups: true
          code_type_prob_map:  # Must explicitly set all types to sum to 1.0
            original: 1.0
            hinted: 0.0
            stubbed: 0.0
            obfuscated_hinted: 0.0
            obfuscated: 0.0
          samples_per_family: 1
          draw_attempts: 5
          fallback_to_orig: false
        transform_config:
          seed: 0
          transform_strategy: never
    # Parser overrides for train/valid subsets
    dataparser_config_overrides:
      train:
        filtering_config:
          max_traces_per_solution: 3  # limit number of traces per solution (for smaller dataset)
          max_code_line_count: 250  # limit code line count (for smaller+easier dataset)
          max_code_line_length: 250  # limit code line length (for smaller+easier dataset)
          max_code_length: 2500  # limit total code length (for smaller+easier dataset)
          max_args_length: 500  # limit inputs/outputs max length (for smaller+easier dataset)
        selection_config:
          code_type_prob_map:  # Must explicitly set all types to sum to 1.0
            original: 0.75
            hinted: 0.05
            stubbed: 0.1
            obfuscated_hinted: 0.05
            obfuscated: 0.05
          samples_per_family: 1
          draw_attempts: 5
          fallback_to_orig: true
        transform_config:
          transform_strategy: never
      valid:
        filtering_config:
          max_traces_per_solution: 1  # limit number of traces per solution (for smaller dataset)
          max_code_line_count: 250  # limit code line count (for smaller+easier dataset)
          max_code_line_length: 250  # limit code line length (for smaller+easier dataset)
          max_code_length: 2500  # limit total code length (for smaller+easier dataset)
          max_args_length: 500  # limit inputs/outputs max length (for smaller+easier dataset)
        selection_config:
          code_type_prob_map:  # Must explicitly set all types to sum to 1.0
            original: 1.0
            hinted: 0.0
            stubbed: 0.0
            obfuscated_hinted: 0.0
            obfuscated: 0.0
          samples_per_family: 1
          draw_attempts: 5
          fallback_to_orig: false
        transform_config:
          transform_strategy: never
    # Dataloader config
    dataloader_config_overrides:
      train:
        shuffle: true
    # Dataset settings
    keep_generated_datasets_in_memory: false
    evaluation_strategy: counterfactual
    eval_hint_types: [helpful, misleading]
    train_subset_names: [train]
    valid_subset_names: [valid]
    eval_subset_names: [valid]
    instantiate_parsers_at_setup: false
    use_local_dataset_cache: true
    use_tokenized_dataset_cache: true
    cache_lock_timeout_seconds: 1800.0
    message_generator_num_workers: 8
    min_samples_hinted: 0
    min_samples_misleading: 0
    min_samples_hintless: 0
    require_validated_misleading: true
    add_line_numbers: false  # whether to add line numbers to formatted code strings
    add_block_markers: false  # whether to add block-of-interest markers to formatted code strings
    # if we want to IMPORT pregenerated output overrides from a previous run, uncomment these lines:
    #pregenerated_outputs_lmdb_paths: null  # single path, list of paths, or glob (e.g. output/rank_*)
    #pregenerated_outputs_selection: latest  # "latest" (highest gen count) or "best_reward"
    #pregenerated_outputs_phase_prefix: ""  # empty = load all phases (safe with problem-level splits)
    #pregenerated_outputs_only_matched: false  # true = only keep samples with a matching override

  # if we want to EXPORT generations for later experiments, uncomment these lines:
  # (note: )requires logging.enabled=true, logging.log_total=true, logging.main_process_only=true)
  #generation_export_config:
  #  output_path: ${runtime.output_dir}/generation_export.lmdb
  #  log_every_n_generations: 1

  # GRPO training arguments (RL equivalent of training_args_config)
  grpo_config:
    do_train: True
    do_eval: True
    do_predict: False
    # note: report_to is set dynamically by the trainer based on wandb availability
    # ------------
    per_device_train_batch_size: 4  # GRPO typically uses smaller batch sizes
    per_device_eval_batch_size: 5  # Larger eval batch (from prototype train_grpo.py)
    gradient_accumulation_steps: 8
    learning_rate: 5e-6  # Lower than SFT (2e-4) for RL stability
    weight_decay: 0.0
    lr_scheduler_type: "constant"
    warmup_ratio: 0.0
    gradient_checkpointing: True
    gradient_checkpointing_kwargs:
      use_reentrant: False
    optim: "adamw_torch_fused"
    max_grad_norm: 1.0
    # ------------
    num_train_epochs: 1
    max_steps: -1 # alternative to num_train_epochs
    logging_steps: 1  # From prototype train_grpo.py
    eval_on_start: True  # Evaluate before training starts (from prototype)
    eval_strategy: "steps"
    eval_steps: 10
    save_strategy: "steps"
    save_steps: 500  # From prototype train_grpo.py
    save_total_limit: 3
    dataloader_num_workers: 4
    dataloader_pin_memory: False
    # ------------
    # GRPO-specific parameters (from prototype train_grpo.py)
    num_generations: 16  # Number of generations per prompt to sample. The effective batch size (num_processes * per_device_batch_size * gradient_accumulation_steps) must be evenly divisible by this value.
    num_generations_eval: 1  # Use fewer generations during eval to save compute
    max_completion_length: 10000  # Allow longer completions for complex code execution
    # max_prompt_length: 3000  # truncate prompts beyond this length (last-resort)
    temperature: 1.0
    top_p: 0.9
    beta: 0.00  # KL penalty coefficient
    scale_rewards: "none" # If to scale rewards by "group" (default) "batch" or "none"
    use_vllm: true  # Prototype uses true, but requires manual vLLM server setup
    vllm_importance_sampling_correction: true
    vllm_mode: "colocate"  # "server" (default) or "colocate"
    # vLLM configuration for colocated mode
    vllm_gpu_memory_utilization: 0.15 # (default 0.3) Control the GPU memory utilization for vLLM.
    vllm_max_model_length: 13000 # (optional): Context window for vLLM. Set it to at least the maximum prompt length in the dataset plus `max_completion_length`; if omitted, it is inferred from the model config.
    vllm_tensor_parallel_size: 1 # (optional, defaults to `1`) Control the tensor parallel size for vLLM. If the model fits in a single GPU, set it to `1`, will use data parallelism.
    vllm_enable_sleep_mode: False # (default False) Enable vLLM sleep mode to offload weights/cache during the optimizer step. Keeps GPU memory usage low, but waking the engine adds host–device transfer latency.
    # vLLM configuration for server mode
    vllm_server_port: 8050  # From prototype (was 8000)


  # Reward manager configuration
  reward_manager_config:
    # Parsing configuration for extracting final answers from model output
    parsing:
      mode: tags  # extract content from XML-style tags
      enabled_fields: both  # parse both reasoning and final answer
      final_tag: final  # look for <final>...</final> tags (as used in the targeted code exec prompt)
      reasoning_from_outside_final: true  # consider any output outside the final answer as reasoning
      reasoning_from_entire_output_when_no_final_answer: true  # treat full output as reasoning if needed
      fallback_policy: none  # no fallback if tags are missing
      multi_tag_policy: last  # use last occurrence if multiple tags present
      strict: false  # allow partial matches without raising an exception
      capture_diagnostics: true  # log parsing diagnostics for debugging
      track_token_lengths: true  # log token counts for generated/parsed outputs

    # Reward terms to evaluate
    terms:
      - name: soft_match
        type: soft_match  # or "code_exec/soft_match"
        weight: 1.0
        enabled: true
        require_parsed: true  # Requires parsed output
        params:
          reward_if_match: 1.0
          reward_if_no_match: 0.0

      # Traced (structured) reasoning: rewards structured step-by-step reasoning in <steps> blocks
      # (requires `add_line_numbers: true` in datamodule, and prompt version: rl_stepped_reasoning)
      #- name: traced_reasoning
      #  type: traced_reasoning
      #  weight: 1.0
      #  enabled: true
      #  require_parsed: false
      #  params:
      #    format_presence_reward: 0.05
      #    structural_validity_weight: 0.05
      #    grounding_weight: 0.05
      #    incorrectness_penalty: 0.5

    # Aggregation configuration
    aggregation:
      strategy: weighted_sum
      clip_total_min: 0.0
      clip_total_max: null
      clip_term_min: null
      clip_term_max: null

    # verbosity scaling configuration (penalizes verbose outputs relative to group)
    verbosity_scaling:
      enabled: true
      length_source: parsed_reasoning
      mode: absolute
      decay_type: linear
      threshold_tokens: 0
      end_tokens: ${config.grpo_config.max_completion_length}
      temperature: 1.0
      min_factor: 0.1
      max_factor: 1.0
      emit_metrics: true
      skip_negative_rewards: true

    # Difficulty estimation configuration (analyzes reward vs task complexity)
    difficulty:
      enabled: true
      primary_source: trace_step_count  # reasoning depth (number of trace steps)
      secondary_sources: [halstead_effort]  # computational burden proxy
      normalization_mode: log
      num_difficulty_bins: 10

    # Logging configuration for reward metrics
    logging:
      enabled: true
      log_total: true
      log_terms: true
      log_batch_stats: true
      log_metrics: true
      log_tables: true
      log_every_n_generations: 16  # log sample metrics (scalars + table rows) every 30 generations
      table_max_rows: 100  # flush table when buffer reaches this size
      main_process_only: true
      gather_distributed_summaries: true
      barrier_before_finalize: true
      category_extraction_config:  # optional category extraction config
        enabled_fields:
          - "code_type"
          - "tags"
        tag_prefixes:
          - "parser"
          - "total_steps"
          - "difficulty"

  # LoRA configuration (same as SFT v0)
  #lora_config:
  #  r: 8
  #  lora_alpha: 16
  #  lora_dropout: 0.1
  #  bias: none
  #  task_type: CAUSAL_LM
  #  target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]

  # benchmarking settings below apply on top of default pass_at_k base: 10 attempts, temp=0.2, etc.
  evals_config:
    eval_batch_size: 24  # reduce if OOM during eval
    eval_generation_max_new_tokens_override: ${config.grpo_config.max_completion_length}
    output_parsing_config: ${config.reward_manager_config.parsing}
    category_extraction_config:
      enabled_fields:
        - code_type
        - predict_type
        - has_keyword
        - identifier_suffix
    disk_export_config:  # persist prediction artifacts to LMDB for post-hoc re-evaluation
      output_path: ${runtime.output_dir}/benchmark_export
      store_aggregated_metrics: true
