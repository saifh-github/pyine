# @package _global_

# meant for the hf trainer only

defaults:
  - original/v0
  - override /config/datamodule_config: TACO_10s10t_v1_part1to13
  - _self_

runtime:
  exp_name: original/v0_50perc_dataset_qwen3_4B
  run_name: "${runtime.exp_name}_${now:%Y%m%d_%H%M%S}"

config:
  use_wandb_logging: false
  resume_from_run_dir: "/path/to/previous/run/directory"
  resume_checkpoint_name: checkpoint-1600
  resume_incompatibility_policy: ignore
  resume_wandb_behavior: never
  base_model: Qwen/Qwen3-4B-Instruct-2507
  training_args_config:
    do_train: False
    do_eval: False
    do_predict: True
  evals_config:
    eval_batch_size: 24
    evaluator_kwargs:
      llm_provider_config: null
      #comparison_options: # These are not changed, but here for reference on some possible options
      #  rel_tol: 1.0e-3  # Lenient: 0.1% relative difference allowed
      #  abs_tol: 1.0e-3  # Lenient: 0.001 absolute difference allowed
      #  normalize_whitespace: true  # Normalize internal whitespace
      #  strip: true  # Strip leading/trailing whitespace
      #  case_sensitive: false  # Case-insensitive comparison
      #  numeric_token_tolerance: true  # Apply numeric tolerances to numbers in text
      #  list_order_matters: true  # List element order must match
      #  tuple_order_matters: true  # Tuple element order must match
      #  array_type_matters: false  # Lists and tuples compared as sequences
      #  nan_equal: true  # NaN values are considered equal
  datamodule_config:
    eval_subset_names: ["valid"]  # Only evaluate on validation set and possibly "test" (not train)
