config:
  use_wandb_logging: true
  base_model: Qwen/Qwen2.5-Coder-7B-Instruct
  # @@@@ TODO: 4-bit quant + paged optim using bitsandbytes?
  auto_model_config:
    use_cache: False  # disable cache during training (auto-re-enabled during evals)
  datamodule_config:
    datamodule_class_path: pyine.organisms.datamodules.shortcuts.ShortcutBiasDataModule
    datamodule_name: null
    dataparser_config_overrides:
      train:
        filtering_config: {}
        selection_config:
          code_type_prob_map:  # Updated from input_type_prob_map
            original: 1.0
            hinted: 0.0
            stubbed: 0.0
            obfuscated_hinted: 0.0
            obfuscated: 0.0
          fallback_to_orig: true
        transform_config:
          transform_strategy: never
      valid:
        filtering_config: {}
        selection_config:
          code_type_prob_map:  # Updated from input_type_prob_map
            original: 1.0
            hinted: 0.0
            stubbed: 0.0
            obfuscated_hinted: 0.0
            obfuscated: 0.0
          fallback_to_orig: true
        transform_config:
          transform_strategy: never
    # ------------
    keep_generated_datasets_in_memory: False
    # max_solution_count: 1
    # ------------
  collator_hard_seq_length_cap: 4096
  training_args_config:
    do_train: True
    do_predict: False
    # ------------
    per_device_train_batch_size: 2  # increase if seq len is short enough?
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 2e-4  # LoRA likes higher LR
    weight_decay: 0.05
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.03
    gradient_checkpointing: True
    gradient_checkpointing_kwargs:
      use_reentrant: False
    optim: "adamw_torch_fused"
    max_grad_norm: 1.0 #0.3
    # ------------
    max_steps: 10000
    logging_steps: 1
    eval_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 3
    dataloader_num_workers: 4
    dataloader_pin_memory: False
    # use_liger_kernel: True
    #group_by_length: True
    #metric_for_best_model: "eval_loss"
    #greater_is_better: False
    include_tokens_per_second: True
  lora_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    bias: none
    task_type: CAUSAL_LM
    target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]
  evals_config:  # for final generation evals
    eval_batch_size: 24
