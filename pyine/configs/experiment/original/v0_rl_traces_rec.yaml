# @package _global_

# RL training config for generation recordings
# Usage: uv run python -m pyine.apps.trainers.hf_trainer +experiment=original/v0_rl_30B

defaults:
  - original/v0_rl
  - override /config/datamodule_config: shortcuts_TACO_10s10t_v1_full
  - _self_

runtime:
  exp_name: original/traces_recording_full_new_ds
  run_name: "${runtime.exp_name}"
  tags:
    - "model:checkpoint-500"
    - "rl-training"
config:
  base_model: /scratch/user/code-interp-benchmark/checkpoints/checkpoint-500

  generation_export_config:
    output_path: ${runtime.output_dir}/generation_export.lmdb
    log_every_n_generations: 1

  grpo_config:
    per_device_train_batch_size: 4  # GRPO typically uses smaller batch sizes
    per_device_eval_batch_size: 5  # Larger eval batch (from prototype train_grpo.py)
    gradient_accumulation_steps: 8
    learning_rate: 0.0  # Lower than SFT (2e-4) for RL stability
    # ------------
    max_steps: 1 # alternative to num_train_epochs
    eval_steps: 100

  lora_config:
    r: 4
    lora_alpha: 8
    lora_dropout: 0.1
    bias: none
    task_type: CAUSAL_LM
    target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]
