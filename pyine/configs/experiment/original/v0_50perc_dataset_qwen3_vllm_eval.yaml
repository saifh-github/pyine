# @package _global_

# vLLM evaluation WITHOUT grading (uses single vLLM server for inference only)
#
# Model names are auto-derived from model/checkpoint paths:
#   - For HuggingFace models: uses full model string (e.g., "Qwen/Qwen3-4B-Instruct-2507")
#   - For checkpoints: uses last 3 path components (e.g., "runs/exp_123/checkpoint-1600")
#   - Can be overridden with --model_name flag
#
# Setup:
#   Terminal 1 - Evaluation Model:
#     python scripts/vllm_eval/vllm_server.py \
#       --checkpoint_path /path/to/checkpoint \
#       --port 8000 \
#       --cuda_devices 0,1,2,3
#     # Model name auto-derived from checkpoint path

defaults:
  - original/v0
  - override /config/datamodule_config: shortcuts_TACO_10s10t_v1_part1to13
  - _self_

runtime:
  exp_name: original/v0_50perc_dataset_qwen3_4B
  run_name: "${runtime.exp_name}_${now:%Y%m%d_%H%M%S}"

config:
  use_wandb_logging: false
  base_model: Qwen/Qwen3-4B-Instruct-2507
  training_args_config:
    do_train: False
    do_eval: False
    do_predict: True
  datamodule_config:
    eval_subset_names: ["valid"]  # Only evaluate on validation set and possibly "test" (not train)
  evals_config:
    eval_batch_size: 24
    evaluator_kwargs:
      llm_provider_config: null
    # vLLM configuration using provider config
    vllm_provider_config:
      provider: vllm
      model_kwargs:
        base_url: "http://localhost:8000/v1"
        model: "runs/exp_123/checkpoint-1600"  # Auto-derived from checkpoint path (adjust to match your actual path)
        max_tokens: 1024  # Match HF default (eval_generation_max_new_tokens_override)
        temperature: 0.0  # Deterministic for evaluation
    # Concurrency control (standard across all providers)
    eval_runnable_config:
      parallel: true
      max_workers: 32  # Thread pool size
      max_in_flight_jobs: 32  # Sliding window size
