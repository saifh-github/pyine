[project]
name = "vllm-eval"
version = "0.1.0"
description = "vLLM evaluation server and client utilities"
requires-python = ">=3.10"
dependencies = [
    # Core vLLM dependency
    "vllm>=0.6.0",

    # Model loading and LoRA merging
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "torch>=2.1.0",

    # OpenAI client for vLLM API calls
    "openai>=1.0.0",

    # Additional dependencies that vLLM may need
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
