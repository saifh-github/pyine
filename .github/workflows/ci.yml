name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty .env for CI
        run: |
          rm -f .env
          touch .env

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-${{ steps.setup-python.outputs.python-version }}-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (with dev extras)
        run: |
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          pip --version
          pip list

      - name: Run pre-commit (make check)
        run: make check

      - name: Run tests (fast subset)
        run: make test
