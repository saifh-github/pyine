name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (with dev extras)
        run: |
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          pip --version
          pip list

      - name: Run pre-commit (make check)
        run: make check

      - name: Run tests (fast subset)
        run: make test
