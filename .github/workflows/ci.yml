name: Base (template-defined) CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']  # Can add '3.13' when dependencies support it

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ensure empty .env (for safety)
      run: |
        rm -f .env
        touch .env

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: make install

    - name: Run linting
      run: make lint

    - name: Run fast tests with coverage
      run: make coverage

    - name: Upload coverage artifacts
      if: always() && hashFiles('logs/coverage/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: logs/coverage/

    - name: Run integration tests
      if: contains(github.event.pull_request.labels.*.name, 'integration')
      run: make test-integration

    - name: Run slow tests
      if: contains(github.event.pull_request.labels.*.name, 'slow')
      run: make test-slow
