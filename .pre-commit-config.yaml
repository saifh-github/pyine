# this file configures the hooks that will run when calling `pre-commit run -a`
# list of supported hooks: https://pre-commit.com/hooks.html
# to update the list of hooks, run `pre-commit autoupdate`

default_language_version:
  python: python3.12

repos:
  # classic hooks from the pre-commit repo itself
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-yaml
        args: [ "--unsafe" ]  # needed since we use tags in YAML files w/ custom safe loading

  # python code formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  # python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort

  # python upgrading syntax to newer version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]

  # python docstring formatting - disabled because of some problem
  # with the plugin - re-enable if it is fixed
  #  - repo: https://github.com/myint/docformatter
  #    rev: v1.7.5
  #    hooks:
  #      - id: docformatter
  #        args:
  #          [
  #            "--in-place",
  #            "--wrap-summaries=100",
  #            "--wrap-descriptions=100",
  #            "--style=sphinx",
  #            "--black",
  #          ]

  # python check (PEP8), programming errors and code complexity
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          [
            "--extend-ignore=E203,E402,E501,F401,F841,RST2,RST301",
            "--exclude=logs/*,data/*,build/*,docs/*",
         ]

  # md formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: ["--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
          - mdformat_frontmatter
          # - mdformat-toc
          # - mdformat-black

  # jupyter notebook cell output clearing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # jupyter notebook linting
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
      - id: nbqa-isort
      - id: nbqa-flake8
